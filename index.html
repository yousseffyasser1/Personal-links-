<head>

  <style>
    :root {
      --mist: #eceef7;
      --blue: #3040ff;
      --blue-deep: #1f2bd1;
      --ink: #14152e;
      --sun: #ffd84a;
      --paper: #ffffff;
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      padding: 0 20px 48px;
      background: var(--mist);
      color: var(--ink);
      font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    /* ---------- Lanyard + badge (one swing on page load) ---------- */
    .pendulum {
      width: min(100%, 380px);
      transform-origin: 50% 0;
      animation: swing 2.4s ease-out both;
    }

    @keyframes swing {
      0%   { transform: rotate(7deg); }
      25%  { transform: rotate(-4.5deg); }
      50%  { transform: rotate(3deg); }
      70%  { transform: rotate(-1.6deg); }
      85%  { transform: rotate(0.7deg); }
      100% { transform: rotate(0); }
    }

    .strap {
      width: 40px;
      height: 110px;
      margin: 0 auto;
      background:
        linear-gradient(90deg, #0000 6px, #fff4 6px 8px, #0000 8px 32px, #fff4 32px 34px, #0000 34px),
        var(--blue-deep);
    }

    .clip {
      position: relative;
      z-index: 2;
      width: 26px;
      height: 40px;
      margin: -6px auto -22px;
      border-radius: 8px;
      background: linear-gradient(#f1f2fa, #a9afc9);
      box-shadow: 0 2px 5px rgba(20, 21, 46, .3), inset 0 0 0 2px rgba(255, 255, 255, .6);
    }

    .card {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      background: var(--paper);
      box-shadow: 0 34px 60px -24px rgba(20, 21, 46, .45);
    }

    .slot {
      position: absolute;
      top: 16px;
      left: 50%;
      width: 70px;
      height: 12px;
      transform: translateX(-50%);
      border-radius: 99px;
      background: var(--mist);
      box-shadow: inset 0 2px 3px rgba(20, 21, 46, .3);
    }

    /* ---------- Identity (blue half) ---------- */
    .identity {
      padding: 52px 28px 44px;
      text-align: center;
      background: var(--blue);
      color: #fff;
    }

    .photo {
      width: 170px;
      height: 210px;
      margin: 0 auto;
      border-radius: 85px 85px 24px 24px;
      background: #fff;
      box-shadow: 0 0 0 6px rgba(255, 255, 255, .22);
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .initials {
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-weight: 800;
      font-size: 3.4rem;
      color: var(--blue);
    }

    .name {
      margin: 26px 0 0;
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-weight: 800;
      font-size: clamp(2.3rem, 10vw, 2.9rem);
      line-height: .98;
      letter-spacing: -0.025em;
    }

    .role {
      display: inline-block;
      margin: 16px 0 0;
      padding: 7px 16px;
      border-radius: 99px;
      background: var(--sun);
      color: var(--ink);
      font-weight: 600;
      font-size: .95rem;
    }

    /* ---------- Links (white half) ---------- */
    .links {
      position: relative;
      padding: 38px 24px 30px;
    }

    /* ticket notches + tear line between the two halves */
    .links::before {
      content: "";
      position: absolute;
      top: 0;
      left: 22px;
      right: 22px;
      border-top: 2px dashed #c9cde4;
    }
    .links::after {
      content: "";
      position: absolute;
      top: -14px;
      left: 0;
      right: 0;
      height: 28px;
      background:
        radial-gradient(circle 14px at 0 14px, var(--mist) 97%, transparent 100%),
        radial-gradient(circle 14px at 100% 14px, var(--mist) 97%, transparent 100%);
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 56px;
      padding: 0 18px;
      border-radius: 16px;
      border: 2px solid var(--ink);
      font: inherit;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: background-color .2s, color .2s;
    }
    .btn + .btn { margin-top: 12px; }
    .btn svg { flex: none; width: 22px; height: 22px; }
    .btn .ext { margin-left: auto; width: 18px; height: 18px; opacity: .75; }

    .btn-primary { background: var(--ink); color: #fff; }
    .btn-primary:hover { background: #26285a; }

    .btn-ghost { background: transparent; color: var(--ink); }
    .btn-ghost:hover { background: var(--mist); }

    .socials {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 26px 0 0;
      padding: 0;
      list-style: none;
      flex-wrap: wrap;
    }

    .socials a {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--mist);
      color: var(--ink);
      transition: background-color .2s, color .2s;
    }
    .socials a:hover { background: var(--blue); color: #fff; }
    .socials svg { width: 22px; height: 22px; }

    a:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 3px;
    }
    .identity a:focus-visible { outline-color: #fff; }

    @media (prefers-reduced-motion: reduce) {
      .pendulum { animation: none; }
      .btn, .socials a { transition: none; }
    }
  </style>
</head>

  <script>
    // لو الصورة مش موجودة، يظهر بدالها الحروف الأولى من الاسم
    (function () {
      var img = document.querySelector(".photo img");
      function fallback() {
        var parts = document.querySelector(".name").textContent.trim().split(/\s+/);
        var span = document.createElement("span");
        span.className = "initials";
        span.textContent = (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
        img.replaceWith(span);
      }
      img.addEventListener("error", fallback);
      if (img.complete && img.naturalWidth === 0) fallback();
    })();

    // تحميل السيرة الذاتية مباشرة كملف دون مغادرة الصفحة
    (function () {
      var cvBtn = document.getElementById("download-cv-btn");
      if (!cvBtn) return;
      cvBtn.addEventListener("click", function (e) {
        var href = this.getAttribute("href");
        var filename = this.getAttribute("download") || "Youssef_Yasser_CV.pdf";

        fetch(href)
          .then(function (res) {
            if (!res.ok) throw new Error("Fetch failed");
            return res.blob();
          })
          .then(function (blob) {
            var blobUrl = window.URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.style.display = "none";
            a.href = blobUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(function () {
              window.URL.revokeObjectURL(blobUrl);
              a.remove();
            }, 300);
          })
          .catch(function () {
            // في حال تشغيل الملف محلياً file:// بدون سيرفر، يفتح في تبويب جديد دون الخروج من الصفحة الأصلية
            var a = document.createElement("a");
            a.href = href;
            a.download = filename;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            document.body.appendChild(a);
            a.click();
            setTimeout(function () { a.remove(); }, 100);
          });

        e.preventDefault();
      });
    })();
  </script>
